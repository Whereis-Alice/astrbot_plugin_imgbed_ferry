    <path d="M284.67 412.67 L314.37 372.22 L339.97 412.67 Z" fill="#281A3C" opacity="0.863"/>
    <path d="M198.66 412.67 L244.74 351.23 L290.82 412.67 Z" fill="#281A3C"/>
