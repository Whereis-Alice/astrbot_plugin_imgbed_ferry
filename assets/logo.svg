<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="图床摆渡：云端上传与批量图片">
  <title>图床摆渡 / astrbot_plugin_imgbed_ferry</title>
  <defs>
