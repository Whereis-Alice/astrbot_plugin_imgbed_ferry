        <rect x="232.45" y="183.30" width="47.10" height="76.80" rx="8.19" ry="8.19"/>
      </g>
    </mask>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="120.32" ry="120.32" fill="url(#plate)"/>

  <g clip-path="url(#plateClip)">
    <ellipse cx="120.32" cy="51.20" rx="248.32" ry="230.40" fill="#8C6EBE" opacity="0.275" filter="url(#soften)"/>
