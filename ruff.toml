target-version = "py310"
line-length = 100
extend-exclude = ["data", "assets", "__pycache__"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "PIE", "RUF", "ASYNC", "A"]
ignore = [
    "E501",
    "SIM105",
    "SIM115",
    "RUF001",
    "RUF002",
    "RUF003",
    "RET504",
    "B008",
    "A003",
    "A004",
    "ASYNC240",
]

[lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[format]
quote-style = "double"
indent-style = "space"